apiVersion: apps/v1
kind: Deployment
metadata:
  name: pady-app-deployment
  namespace: pady-app
spec:
  replicas: 3     
  selector:
    matchLabels:
      app: pady-app
  template:
    metadata:
      labels:
        app: pady-app
    spec:
      containers:
      - name: pady-app-container
        image: nginx:latest
        ports:
        - containerPort: 80 
