apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pady-data-statefulset
  namespace: pady-data
spec:
  serviceName: "pady-data-service"
  replicas: 2
  selector:
    matchLabels:
      app: pady-data
  template:
    metadata:
      labels:
        app: pady-data
    spec:
      containers:
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379